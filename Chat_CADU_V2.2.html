<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual - CADU</title>
    <style>
        :root {
            --primary-blue: #9dd2ff;
            --dark-blue: #1e3a8a;
            --bg-light: #f0f2f5;
            --chat-bg: #fbfbfb;
            --btn-secondary: #f0f2f5;
            --text-secondary: #555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 400px;
            height: 650px;
            background-color: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 8px solid #333;
        }

        .chat-header {
            background-color: #ffffff;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            color: #666;
            border-bottom: 1px solid #eee;
        }

        .chat-date {
            background-color: #e1e1e1;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 5px;
            color: #333;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble {
            background-color: #f0f0f0;
            color: #222;
            padding: 14px 16px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 15px;
            line-height: 1.4;
            align-self: flex-start;
            animation: fadeIn 0.3s ease-in-out;
        }

        .message-bubble strong {
            color: #000;
        }

        ul, ol {
            margin-top: 8px;
            padding-left: 18px;
        }
        li {
            margin-bottom: 5px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            margin-top: 10px;
            padding-bottom: 10px;
        }

        .btn-option {
            background-color: #ffffff;
            color: var(--dark-blue);
            border: 1.5px solid var(--dark-blue);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: right;
            width: 100%;
            text-align: center;
        }

        .btn-option:hover {
            background-color: var(--primary-blue);
            transform: scale(1.02);
        }

        .btn-secondary {
            background-color: var(--btn-secondary);
            color: var(--text-secondary);
            border-color: #ccc;
        }

        .btn-secondary:hover {
            background-color: #e4e6e9;
            color: #333;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--dark-blue);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 12px;
            padding: 0;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #000;
            text-decoration: underline;
        }

        .bill-zoom-container {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #1e3a8a;
            position: relative;
            background-color: #fff;
            margin-bottom: 8px;
        }

        .bill-img {
            width: 100% !important;
            height: auto !important;
            position: absolute;
            transform-origin: top left;
            transition: all 0.3s ease;
        }

        .zoom-registro-atual-conta { transform: scale(3.5) translate(-20%, -76%); }
        .zoom-data-atual-conta     { transform: scale(3.5) translate(-47%, -73%); }
        .zoom-proxima-leitura      { transform: scale(3.5) translate(-70%, -73%); }
        
        .zoom-hidrometro-exemplo {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            position: static;
        }

        .input-step-container {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 1.5px solid var(--primary-blue);
            width: 100%;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
        }

        .input-step-container label {
            font-size: 14px;
            color: #333;
        }

        .input-step-container input[type="date"],
        .input-step-container input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span class="chat-date">Hoje</span>
    </div>

    <div class="chat-messages" id="chatBox"></div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    let timeoutsAtivos = [];
    let dadosContaAlta = {};
    let dadosSimulacao = {};

    function agendarTimeout(callback, delay) {
        const id = setTimeout(callback, delay);
        timeoutsAtivos.push(id);
    }

    function limparTodosTimeouts() {
        timeoutsAtivos.forEach(clearTimeout);
        timeoutsAtivos = [];
    }

    function limparHistoricoEAdicionarBalao(textoBalao, ehUsuario = false) {
        chatBox.innerHTML = "";
        adicionarBalao(textoBalao, ehUsuario);
    }

    function adicionarBalao(texto, ehUsuario = false) {
        const balao = document.createElement('div');
        balao.className = 'message-bubble';
        
        if (ehUsuario) {
            balao.style.alignSelf = 'flex-end';
            balao.style.backgroundColor = 'var(--dark-blue)';
            balao.style.color = '#fff';
        }
        
        balao.innerHTML = texto;
        chatBox.appendChild(balao);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function tratarErroImagem(img, tipo) {
        img.onerror = null; 
        img.style.transform = 'none'; 
        img.style.position = 'static';
        img.style.width = '100%';
        img.style.height = '100%';
        
        const textoPlaceholder = tipo === 'conta' ? '📋 [Imagem da Conta]' : '⏱️ [Imagem do Hidrômetro]';
        img.src = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='150'><rect width='100%' height='100%' fill='%23f3f4f6'/><text x='50%' y='55%' font-family='sans-serif' font-size='14' font-weight='bold' fill='%231e3a8a' text-anchor='middle'>${textoPlaceholder}</text></svg>`;
    }

    // --- CÓDIGO DA SIMULAÇÃO DE FATURA ---
    function iniciarSimulacaoFatura() {
        dadosSimulacao = {
            dataLeituraConta: '',
            dataProxima: '',
            leituraAtualConta: '',
            leituraHidrometro: '',
            dataHidrometro: '',
            previsaoM3: 0
        };
        const textoApresentacao = `Para te ajudar, faremos uma simulação detalhada da sua fatura.<br><br>⚠️ <strong>Atenção aos requisitos:</strong><br>1. Esteja com a sua <strong>conta de água mais recente</strong> em mãos.<br>2. Tenha <strong>acesso visual ao hidrômetro</strong>.`;
        
        limparHistoricoEAdicionarBalao(textoApresentacao);

        const containerBotoes = document.createElement('div');
        containerBotoes.className = 'options-container';
        containerBotoes.innerHTML = `
            <button class="btn-option" onclick="sim_passo_DataLeituraConta()">Estou Pronto, Vamos Começar!</button>
            <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
        `;
        chatBox.appendChild(containerBotoes);
    }

    function sim_passo_DataLeituraConta() {
        limparHistoricoEAdicionarBalao("<strong>Passo 1 de 5:</strong><br>Informe a data da <strong>Leitura Atual</strong> indicada na sua conta de água:");
        const boxZoom = document.createElement('div');
        boxZoom.className = 'bill-zoom-container';
        boxZoom.innerHTML = `<img src="conta_agua_topo.jpg" class="bill-img zoom-data-atual-conta" onerror="tratarErroImagem(this, 'conta')" alt="Conta DAAE">`;
        chatBox.insertBefore(boxZoom, chatBox.firstChild);

        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <input type="date" id="sim_step_dataLeituraConta" value="${dadosSimulacao.dataLeituraConta}">
            <div class="button-group">
                <button class="btn-option" onclick="sim_salvar_DataLeituraConta()">Avançar</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function sim_salvar_DataLeituraConta() {
        const valor = document.getElementById('sim_step_dataLeituraConta').value;
        if(!valor) { alert("Por favor, informe a data da leitura atual da conta."); return; }
        dadosSimulacao.dataLeituraConta = valor;
        sim_passo_DataProxima();
    }

    function sim_passo_DataProxima() {
        limparHistoricoEAdicionarBalao("<strong>Passo 2 de 5:</strong><br>Informe a data da Próxima Leitura informada na conta:");
        const boxZoom = document.createElement('div');
        boxZoom.className = 'bill-zoom-container';
        boxZoom.innerHTML = `<img src="conta_agua_topo.jpg" class="bill-img zoom-proxima-leitura" onerror="tratarErroImagem(this, 'conta')" alt="Conta DAAE">`;
        chatBox.insertBefore(boxZoom, chatBox.firstChild);

        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="sim_passo_DataLeituraConta()">⬅️ Voltar à etapa anterior</button>
            <input type="date" id="sim_step_dataProxima" value="${dadosSimulacao.dataProxima}">
            <div class="button-group">
                <button class="btn-option" onclick="sim_salvar_DataProxima()">Avançar</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function sim_salvar_DataProxima() {
        const valor = document.getElementById('sim_step_dataProxima').value;
        if(!valor) { alert("Por favor, informe a data da próxima leitura."); return; }
        dadosSimulacao.dataProxima = valor;
        sim_passo_LeituraAtualConta();
    }

    function sim_passo_LeituraAtualConta() {
        limparHistoricoEAdicionarBalao("<strong>Passo 3 de 5:</strong><br>Informe o número do <strong>Registro Atual</strong> impresso na sua conta:");
        const boxZoom = document.createElement('div');
        boxZoom.className = 'bill-zoom-container';
        boxZoom.innerHTML = `<img src="conta_agua_topo.jpg" class="bill-img zoom-registro-atual-conta" onerror="tratarErroImagem(this, 'conta')" alt="Conta DAAE">`;
        chatBox.insertBefore(boxZoom, chatBox.firstChild);

        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="sim_passo_DataProxima()">⬅️ Voltar à etapa anterior</button>
            <input type="number" id="sim_step_leituraAtualConta" placeholder="Exemplo: 815" value="${dadosSimulacao.leituraAtualConta}">
            <div class="button-group">
                <button class="btn-option" onclick="sim_salvar_LeituraAtualConta()">Avançar</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function sim_salvar_LeituraAtualConta() {
        const valor = parseFloat(document.getElementById('sim_step_leituraAtualConta').value);
        if(isNaN(valor)) { alert("Por favor, digite o número do Registro Atual da conta."); return; }
        dadosSimulacao.leituraAtualConta = valor;
        sim_passo_LeituraHidrometro();
    }

    function sim_passo_LeituraHidrometro() {
        limparHistoricoEAdicionarBalao("<strong>Passo 4 de 5:</strong><br>Olhe para o mostrador físico do seu hidrômetro (relógio) e digite aqui apenas os <strong>números pretos</strong> atuais.<br><br>Veja abaixo um exemplo: neste caso, bastaria digitar <strong>0003</strong> ou <strong>3</strong>.");
        
        const boxZoom = document.createElement('div');
        boxZoom.className = 'bill-zoom-container';
        boxZoom.innerHTML = `<img src="Foto_HM.jpg" class="zoom-hidrometro-exemplo" onerror="tratarErroImagem(this, 'hidrometro')" alt="Exemplo Hidrômetro">`;
        chatBox.insertBefore(boxZoom, chatBox.firstChild);

        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="sim_passo_LeituraAtualConta()">⬅️ Voltar à etapa anterior</button>
            <input type="number" id="sim_step_leituraHidrometro" placeholder="Exemplo: 820" value="${dadosSimulacao.leituraHidrometro}">
            <div class="button-group">
                <button class="btn-option" onclick="sim_salvar_LeituraHidrometro()">Avançar</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function sim_salvar_LeituraHidrometro() {
        const valor = parseFloat(document.getElementById('sim_step_leituraHidrometro').value);
        if(isNaN(valor)) { alert("Por favor, informe os números pretos do hidrômetro."); return; }
        dadosSimulacao.leituraHidrometro = valor;
        sim_passo_ViuHoje();
    }

    function sim_passo_ViuHoje() {
        limparHistoricoEAdicionarBalao("<strong>Passo 5 de 5:</strong><br>Você viu esse número no hidrômetro hoje?");
        
        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="sim_passo_LeituraHidrometro()">⬅️ Voltar à etapa anterior</button>
            <div class="button-group">
                <button class="btn-option" onclick="sim_salvar_ViuHoje(true)">Sim, vi hoje</button>
                <button class="btn-option" onclick="sim_salvar_ViuHoje(false)">Não, foi em outro dia</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function sim_salvar_ViuHoje(viuHoje) {
        if(viuHoje) {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            dadosSimulacao.dataHidrometro = `${ano}-${mes}-${dia}`;
            sim_executarCalculoFinal();
        } else {
            sim_passo_PedirDataAtualManual();
        }
    }

    function sim_passo_PedirDataAtualManual() {
        limparHistoricoEAdicionarBalao("Por favor, selecione abaixo a data em que você realizou essa leitura no hidrômetro:");
        
        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="sim_passo_ViuHoje()">⬅️ Voltar à etapa anterior</button>
            <input type="date" id="sim_step_dataHidrometro" value="${dadosSimulacao.dataHidrometro}">
            <div class="button-group">
                <button class="btn-option" onclick="sim_salvar_DataAtualManual()">Avançar</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function sim_salvar_DataAtualManual() {
        const valor = document.getElementById('sim_step_dataHidrometro').value;
        if(!valor) { alert("Por favor, selecione uma data válida."); return; }
        dadosSimulacao.dataHidrometro = valor;
        sim_executarCalculoFinal();
    }

    function sim_executarCalculoFinal() {
        const dHidrometro = new Date(dadosSimulacao.dataHidrometro.replace(/-/g, '/'));
        const dLeituraConta = new Date(dadosSimulacao.dataLeituraConta.replace(/-/g, '/'));
        const dProxima = new Date(dadosSimulacao.dataProxima.replace(/-/g, '/'));
        const msPorDia = 1000 * 60 * 60 * 24;

        const dado1 = Math.round((dHidrometro - dLeituraConta) / msPorDia); 
        const dado2 = Math.round((dProxima - dHidrometro) / msPorDia);  

        if (dado1 <= 0 || (dado1 + dado2) <= 0) {
            alert("Erro nas datas digitadas. Verifique a ordem cronológica em relação à emissão da conta.");
            return;
        }

        const dado3 = dadosSimulacao.leituraHidrometro - dadosSimulacao.leituraAtualConta; 
        const dado4 = dado3 / dado1; 
        const dado5 = dado1 + dado2; 
        const dado6 = Math.round(dado4 * dado5); 

        dadosSimulacao.previsaoM3 = dado6;

        limparHistoricoEAdicionarBalao("Simulando dados...", false);
        
        agendarTimeout(() => {
            const painelResultado = `Dias desde a emissão da conta: <strong>${dado1}</strong><br>` +
                                    `M³ consumidos no período: <strong>${dado3} m³</strong><br>` +
                                    `Dias restantes até o próximo ciclo: <strong>${dado2}</strong><br>` +
                                    `M³ previsto para o fechamento da conta: <strong>${dado6} m³</strong><br><br>` +
                                    `⚠️ <em>Essa é uma simulação volumétrica e o valor final poderá mudar dependendo do seu consumo diário.</em>`;

            limparHistoricoEAdicionarBalao(painelResultado);
            
            agendarTimeout(() => {
                sim_passo_CategoriasImovel();
            }, 4000);
        }, 1500);
    }

    function sim_passo_CategoriasImovel() {
        const texto = "Para calcular o valor estimado da sua conta, selecione abaixo a categoria do seu imóvel:";
        limparHistoricoEAdicionarBalao(texto);

        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <div style="display: flex; align-items: center; margin-bottom: 12px; background: #f9f9f9; padding: 14px; border-radius: 8px;">
                <label style="display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; margin: 0; width: 100%;">
                    <input type="radio" name="tipo_imovel" id="radio_residencia" style="margin: 0; width: 20px; height: 20px;">
                    🏠 Só Residência
                </label>
            </div>
            
            <div style="display: flex; align-items: center; margin-bottom: 20px; background: #f9f9f9; padding: 14px; border-radius: 8px;">
                <label style="display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; margin: 0; width: 100%;">
                    <input type="radio" name="tipo_imovel" id="radio_comercio" style="margin: 0; width: 20px; height: 20px;">
                    🏢 Só Comércio
                </label>
            </div>

            <div class="button-group">
                <button class="btn-option" onclick="sim_calcularValorFinal()">Calcular Valor Financeiro</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sim_calcularValorFinal() {
        const radRes = document.getElementById('radio_residencia').checked;
        const radCom = document.getElementById('radio_comercio').checked;

        if (!radRes && !radCom) {
            alert("Por favor, selecione uma opção (Residência ou Comércio).");
            return;
        }

        const m3 = dadosSimulacao.previsaoM3 || 0;
        let valorTotal = 0;
        let detalheCalculo = "";
        const categoriaSelecionada = radRes ? "Residência" : "Comércio";

        if (radRes) {
            // Regras progressivas - Residência
            if (m3 <= 10) {
                valorTotal = 70.72;
                detalheCalculo = `• Faixa de 0 a 10 m³ (Valor Fixo): <strong>R$ 70,72</strong>`;
            } else if (m3 <= 20) {
                const faixa2 = m3 - 10;
                valorTotal = 70.72 + (faixa2 * 14.38);
                detalheCalculo = `• Valor Fixo (Até 10 m³): R$ 70,72<br>` +
                                 `• Faixa de 11 a 20 m³: ${faixa2} m³ × R$ 14,38 = R$ ${(faixa2 * 14.38).toFixed(2)}`;
            } else if (m3 <= 50) {
                const faixa3 = m3 - 20;
                valorTotal = 70.72 + (10 * 14.38) + (faixa3 * 21.54);
                detalheCalculo = `• Valor Fixo (Até 10 m³): R$ 70,72<br>` +
                                 `• Faixa de 11 a 20 m³: 10 m³ × R$ 14,38 = R$ 143,80<br>` +
                                 `• Faixa de 21 a 50 m³: ${faixa3} m³ × R$ 21,54 = R$ ${(faixa3 * 21.54).toFixed(2)}`;
            } else if (m3 <= 100) {
                const faixa4 = m3 - 50;
                valorTotal = 70.72 + (10 * 14.38) + (30 * 21.54) + (faixa4 * 31.10);
                detalheCalculo = `• Valor Fixo (Até 10 m³): R$ 70,72<br>` +
                                 `• Faixa de 11 a 20 m³: 10 m³ × R$ 14,38 = R$ 143,80<br>` +
                                 `• Faixa de 21 a 50 m³: 30 m³ × R$ 21,54 = R$ 646,20<br>` +
                                 `• Faixa de 51 a 100 m³: ${faixa4} m³ × R$ 31,10 = R$ ${(faixa4 * 31.10).toFixed(2)}`;
            } else {
                const faixa5 = m3 - 100;
                valorTotal = 70.72 + (10 * 14.38) + (30 * 21.54) + (50 * 31.10) + (faixa5 * 35.82);
                detalheCalculo = `• Valor Fixo (Até 10 m³): R$ 70,72<br>` +
                                 `• Faixa de 11 a 20 m³: 10 m³ × R$ 14,38 = R$ 143,80<br>` +
                                 `• Faixa de 21 a 50 m³: 30 m³ × R$ 21,54 = R$ 646,20<br>` +
                                 `• Faixa de 51 a 100 m³: 50 m³ × R$ 31,10 = R$ 1.555,00<br>` +
                                 `• Faixa acima de 100 m³: ${faixa5} m³ × R$ 35,82 = R$ ${(faixa5 * 35.82).toFixed(2)}`;
            }
        } else {
            // Regras progressivas - Comércio
            if (m3 <= 15) {
                valorTotal = 188.84;

    const textoDicasEconomia = `<br><br>💡 <strong>Dicas para ajudar a diminuir esse consumo:</strong><br>• Acumule roupas para lavar menos vezes por semana com a capacidade máxima;<br>• Reaproveite a água descartada da máquina de lavar para lavar calçadas e quintal;<br>• Desligue o chuveiro enquanto se ensaboa;<br>• Ensaboe toda a louça e depois enxágue tudo de uma vez;<br>• Mantenha a torneira fechada ao escovar os dentes.<br><br>📌 <strong>Dica adicional:</strong> Sempre que for viajar ou se ausentar por mais de 2 dias do imóvel, fechar o registro geral próximo ao hidrômetro.`;

    function ejecutarCalculoFinal() {
        const valorMoradores = parseInt(document.getElementById('step_moradores').value);
        if(isNaN(valorMoradores) || valorMoradores < 0) { alert("Por favor, informe um número de moradores válido (igual ou maior que 0)."); return; }
        dadosContaAlta.moradores = valorMoradores;

        const dHidrometro = new Date(dadosContaAlta.dataHidrometro.replace(/-/g, '/'));
        const dLeituraConta = new Date(dadosContaAlta.dataLeituraConta.replace(/-/g, '/'));
        const dProxima = new Date(dadosContaAlta.dataProxima.replace(/-/g, '/'));
        const msPorDia = 1000 * 60 * 60 * 24;
        
        const diasDecorridos = Math.round((dHidrometro - dLeituraConta) / msPorDia);
        const diasTotais = Math.round((dProxima - dLeituraConta) / msPorDia);

        if (diasDecorridos <= 0 || diasTotais <= 0) {
            alert("Erro nas datas digitadas. Verifique se as datas seguem a ordem cronológica correta a partir da data da conta.");
            return;
        }

        const consumoParcial = dadosContaAlta.leituraHidrometro - dadosContaAlta.leituraAtualConta;
        const consumoDiario = consumoParcial / diasDecorridos;
        const valorEstimadoProximaConta = Math.round(consumoDiario * diasTotais);

        limparHistoricoEAdicionarBalao("Analisando dados do consumo de acordo com a OMS...", false);
        
        agendarTimeout(() => {
            let painelResultado = `Análise de Consumo Concluída! 📊<br><br>• Volume medido no período atual: <strong>${consumoParcial} m³</strong> em ${diasDecorridos} dias.<br>• Consumo médio diário projetado: <strong>${consumoDiario.toFixed(2)} m³</strong>.<br>• Previsão total para o fechamento da conta: <strong>${valorEstimadoProximaConta} m³</strong>.<br><br>`;

            const moradoresValidos = dadosContaAlta.moradores || 1;
            const consumoPorPessoa = valorEstimadoProximaConta / moradoresValidos;
            const referenciaOMS = 6; 

            if (dadosContaAlta.moradores === 0) {
                painelResultado += `Como o número de moradores foi definido como 0, segue a análise geral. Se notar um volume muito alto, recomendamos verificar vazamentos estruturais.`;
                limparHistoricoEAdicionarBalao(painelResultado);
                solicitarDecisaoVazamento();
            }
            else if (consumoPorPessoa < referenciaOMS) {
                painelResultado += `🎉 <strong>Parabéns!</strong> O seu consumo estimado por habitante (${consumoPorPessoa.toFixed(1)} m³) é <strong>inferior</strong> ao referencial da OMS de 6m³ ao mês por pessoa. Continue assim!` + textoDicasEconomia;
                limparHistoricoEAdicionarBalao(painelResultado);
                agendarTimeout(() => carregarEtapa('interacaoZ'), 12000);
            } 
            else if (Math.abs(consumoPorPessoa - referenciaOMS) < 0.1) {
                painelResultado += `O consumo medido está <strong>próximo ao referencial da OMS</strong>, onde cada pessoa gasta em média 6m³ ao mês. O consumo é previsto.` + textoDicasEconomia;
                limparHistoricoEAdicionarBalao(painelResultado);
                agendarTimeout(() => carregarEtapa('interacaoZ'), 12000);
            } 
            else if (consumoPorPessoa > referenciaOMS && (consumoPorPessoa - referenciaOMS) <= 3) {
                painelResultado += `Identificamos que o consumo médio por morador (${consumoPorPessoa.toFixed(1)} m³) variou em até 3m³ <strong>acima da referência de consumo da OMS</strong> (que é de 6m³ por pessoa ao mês). Você pode ajudar a diminuir esse consumo com pequenas mudanças:` + textoDicasEconomia;
                limparHistoricoEAdicionarBalao(painelResultado);
                agendarTimeout(() => carregarEtapa('interacaoZ'), 15000);
            } 
            else {
                painelResultado += `⚠️ <strong>Alerta de Consumo Elevado!</strong> O consumo estimado por pessoa está em <strong>${consumoPorPessoa.toFixed(1)} m³</strong>, ultrapassando consideravelmente a média recomendada pela OMS.<br><br>Gostaria de realizar testes práticos para verificar se há vazamentos ocultos?`;
                limparHistoricoEAdicionarBalao(painelResultado);
                solicitarDecisaoVazamento();
            }
        }, 1500);
    }

    function carregarEtapa(idEtapa) {
        const etapa = fluxo[idEtapa];
        
        if (idEtapa === 'inicio' || idEtapa === 'menu_titularidade') {
            chatBox.innerHTML = "";
        }
        
        adicionarBalao(etapa.texto);

        if (etapa.acaoAutomatica) {
            agendarTimeout(() => {
                carregarEtapa(etapa.acaoAutomatica);
            }, etapa.delay);
            return; 
        }

        const containerBotoes = document.createElement('div');
        containerBotoes.className = 'options-container';

        etapa.opcoes.forEach(opcao => {
            const botao = document.createElement('button');
            botao.className = 'btn-option';
            if (opcao.texto === "Voltar ao Menu") {
                botao.classList.add('btn-secondary');
            }
            
            botao.innerText = opcao.texto;
            botao.onclick = () => {
                containerBotoes.remove();
                if (opcao.acao) {
                    opcao.acao();
                } 
                if (opcao.proximo) {
                    limparHistoricoEAdicionarBalao(opcao.texto, true);
                    agendarTimeout(() => carregarEtapa(opcao.proximo), 500);
                }
            };
            containerBotoes.appendChild(botao);
        });

        chatBox.appendChild(containerBotoes);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.onload = () => carregarEtapa('inicio');
