<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Virtual - CADU</title>
    <style>
        :root {
            --primary-blue: #9dd2ff;
            --dark-blue: #1e3a8a;
            --bg-light: #f0f2f5;
            --chat-bg: #fbfbfb;
            --btn-secondary: #f0f2f5;
            --text-secondary: #555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 400px;
            height: 650px;
            background-color: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 8px solid #333;
        }

        .chat-header {
            background-color: #ffffff;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            color: #666;
            border-bottom: 1px solid #eee;
        }

        .chat-date {
            background-color: #e1e1e1;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 5px;
            color: #333;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble {
            background-color: #f0f0f0;
            color: #222;
            padding: 14px 16px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 15px;
            line-height: 1.4;
            align-self: flex-start;
            animation: fadeIn 0.3s ease-in-out;
        }

        .message-bubble strong {
            color: #000;
        }

        ul, ol {
            margin-top: 8px;
            padding-left: 18px;
        }
        li {
            margin-bottom: 5px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            margin-top: 10px;
            padding-bottom: 10px;
        }

        .btn-option {
            background-color: #ffffff;
            color: var(--dark-blue);
            border: 1.5px solid var(--dark-blue);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: right;
            width: 100%;
            text-align: center;
        }

        .btn-option:hover {
            background-color: var(--primary-blue);
            transform: scale(1.02);
        }

        .btn-secondary {
            background-color: var(--btn-secondary);
            color: var(--text-secondary);
            border-color: #ccc;
        }

        .btn-secondary:hover {
            background-color: #e4e6e9;
            color: #333;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--dark-blue);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 12px;
            padding: 0;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #000;
            text-decoration: underline;
        }

        .bill-zoom-container {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #1e3a8a;
            position: relative;
            background-color: #fff;
            margin-bottom: 8px;
        }

        .bill-img {
            width: 100% !important;
            height: auto !important;
            position: absolute;
            transform-origin: top left;
            transition: all 0.3s ease;
        }

        .zoom-registro-anterior { transform: scale(3.5) translate(0%, -72%); }
        .zoom-data-anterior     { transform: scale(3.5) translate(-47%, -73%); }
        .zoom-proxima-leitura   { transform: scale(3.5) translate(-70%, -73%); }
        
        .zoom-hidrometro-exemplo {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            position: static;
        }

        .input-step-container {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 1.5px solid var(--primary-blue);
            width: 100%;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
        }

        .input-step-container label {
            font-size: 13px;
            color: #555;
            font-weight: bold;
        }

        .input-step-container input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span class="chat-date">Hoje</span>
    </div>

    <div class="chat-messages" id="chatBox"></div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    let timeoutsAtivos = [];
    let dadosContaAlta = {};

    function agendarTimeout(callback, delay) {
        const id = setTimeout(callback, delay);
        timeoutsAtivos.push(id);
    }

    function limparTodosTimeouts() {
        timeoutsAtivos.forEach(clearTimeout);
        timeoutsAtivos = [];
    }

    function limparHistoricoEAdicionarBalao(textoBalao, ehUsuario = false) {
        chatBox.innerHTML = "";
        adicionarBalao(textoBalao, ehUsuario);
    }

    function adicionarBalao(texto, ehUsuario = false) {
        const balao = document.createElement('div');
        balao.className = 'message-bubble';
        
        if (ehUsuario) {
            balao.style.alignSelf = 'flex-end';
            balao.style.backgroundColor = 'var(--dark-blue)';
            balao.style.color = '#fff';
        }
        
        balao.innerHTML = texto;
        chatBox.appendChild(balao);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- CÓDIGO DA ANÁLISE DE CONTA ALTA ---
    function iniciarApresentacaoContaAlta() {
        dadosContaAlta = {
            dataAnterior: '',
            leituraAnterior: '',
            dataProxima: '',
            leituraAtual: '',
            viuHoje: '',
            dataAtual: '',
            moradores: ''
        };
        const textoApresentacao = `Para te ajudar, faremos uma análise detalhada do consumo atual do seu imóvel.<br><br>Com isso, teremos um panorama completo da situação para identificar possíveis alterações ou vazamentos.<br><br>⚠️ <strong>Atenção aos requisitos obrigatórios antes de começar:</strong><br>1. Esteja com a sua <strong>conta de água mais recente</strong> em mãos.<br>2. Tenha <strong>acesso visual ao hidrômetro</strong> (relógio de água) ou uma <strong>foto recente</strong> dele tirada hoje.`;
        
        limparHistoricoEAdicionarBalao(textoApresentacao);

        const containerBotoes = document.createElement('div');
        containerBotoes.className = 'options-container';
        containerBotoes.innerHTML = `
            <button class="btn-option" onclick="passo_DataAnterior()">Estou Pronto, Vamos Começar!</button>
            <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
        `;
        chatBox.appendChild(containerBotoes);
    }

    // Passo 1: Data da Leitura Constante na Conta
    function passo_DataAnterior() {
        limparHistoricoEAdicionarBalao("<strong>Passo 1 de 6:</strong><br>Localize o campo Leitura Data em sua conta e informe a data abaixo:");
        const boxZoom = document.createElement('div');
        boxZoom.className = 'bill-zoom-container';
        boxZoom.innerHTML = `<img src="conta_agua_topo.jpg" class="bill-img zoom-data-anterior" alt="Conta DAAE">`;
        chatBox.insertBefore(boxZoom, chatBox.firstChild);

        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <input type="date" id="step_dataAnterior" value="${dadosContaAlta.dataAnterior}">
            <div class="button-group">
                <button class="btn-option" onclick="salvar_DataAnterior()">Avançar</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function salvar_DataAnterior() {
        const valor = document.getElementById('step_dataAnterior').value;
        if(!valor) { alert("Por favor, informe a data anterior indicada no talão."); return; }
        dadosContaAlta.dataAnterior = valor;
        passo_LeituraAnterior();
    }

    // Passo 2: Registro Anterior
    function passo_LeituraAnterior() {
        limparHistoricoEAdicionarBalao("<strong>Passo 2 de 6:</strong><br>Agora informe o número que está dentro do campo Registro Anterior:");
        const boxZoom = document.createElement('div');
        boxZoom.className = 'bill-zoom-container';
        boxZoom.innerHTML = `<img src="conta_agua_topo.jpg" class="bill-img zoom-registro-anterior" alt="Conta DAAE">`;
        chatBox.insertBefore(boxZoom, chatBox.firstChild);

        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="passo_DataAnterior()">⬅️ Voltar à etapa anterior</button>
            <input type="number" id="step_leituraAnterior" placeholder="Exemplo: 802" value="${dadosContaAlta.leituraAnterior}">
            <div class="button-group">
                <button class="btn-option" onclick="salvar_LeituraAnterior()">Avançar</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function salvar_LeituraAnterior() {
        const valor = parseFloat(document.getElementById('step_leituraAnterior').value);
        if(isNaN(valor)) { alert("Por favor, digite o número do Registro Anterior."); return; }
        dadosContaAlta.leituraAnterior = valor;
        passo_DataProxima();
    }

    // Passo 3: Data da Próxima Leitura
    function passo_DataProxima() {
        limparHistoricoEAdicionarBalao("<strong>Passo 3 de 6:</strong><br>Localize e digite abaixo a data da Próxima Leitura:");
        const boxZoom = document.createElement('div');
        boxZoom.className = 'bill-zoom-container';
        boxZoom.innerHTML = `<img src="conta_agua_topo.jpg" class="bill-img zoom-proxima-leitura" alt="Conta DAAE">`;
        chatBox.insertBefore(boxZoom, chatBox.firstChild);

        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="passo_LeituraAnterior()">⬅️ Voltar à etapa anterior</button>
            <input type="date" id="step_dataProxima" value="${dadosContaAlta.dataProxima}">
            <div class="button-group">
                <button class="btn-option" onclick="salvar_DataProxima()">Avançar</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function salvar_DataProxima() {
        const valor = document.getElementById('step_dataProxima').value;
        if(!valor) { alert("Por favor, selecione a data da próxima leitura."); return; }
        dadosContaAlta.dataProxima = valor;
        passo_LeituraAtual();
    }

    // Passo 4: Número no Hidrômetro (Inclusão do Exemplo Foto_HM)
    function passo_LeituraAtual() {
        limparHistoricoEAdicionarBalao("<strong>Passo 4 de 6:</strong><br>Olhe para o mostrador do seu hidrômetro (relógio) e digite aqui apenas os <strong>números pretos</strong>.<br><br>Veja abaixo um exemplo: neste caso, bastaria digitar <strong>0003</strong> ou <strong>3</strong>.");
        
        const boxZoom = document.createElement('div');
        boxZoom.className = 'bill-zoom-container';
        boxZoom.innerHTML = `<img src="Foto_HM.jpg" class="zoom-hidrometro-exemplo" alt="Exemplo Hidrômetro">`;
        chatBox.insertBefore(boxZoom, chatBox.firstChild);

        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="passo_DataProxima()">⬅️ Voltar à etapa anterior</button>
            <input type="number" id="step_leituraAtual" placeholder="Exemplo: 3" value="${dadosContaAlta.leituraAtual}">
            <div class="button-group">
                <button class="btn-option" onclick="salvar_LeituraAtual()">Avançar</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function salvar_LeituraAtual() {
        const valor = parseFloat(document.getElementById('step_leituraAtual').value);
        if(isNaN(valor)) { alert("Por favor, informe o valor dos números pretos do hidrômetro."); return; }
        dadosContaAlta.leituraAtual = valor;
        passo_ViuHoje();
    }

    // Passo 5: Pergunta se viu hoje ou outra data
    function passo_ViuHoje() {
        limparHistoricoEAdicionarBalao("<strong>Passo 5 de 6:</strong><br>Você viu esse número no hidrômetro hoje?");
        
        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="passo_LeituraAtual()">⬅️ Voltar à etapa anterior</button>
            <div class="button-group">
                <button class="btn-option" onclick="salvar_ViuHoje(true)">Sim, vi hoje</button>
                <button class="btn-option" onclick="salvar_ViuHoje(false)">Não, foi em outro dia</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function salvar_ViuHoje(viuHoje) {
        if(viuHoje) {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            dadosContaAlta.dataAtual = `${ano}-${mes}-${dia}`;
            passo_Moradores();
        } else {
            passo_PedirDataAtual();
        }
    }

    function passo_PedirDataAtual() {
        limparHistoricoEAdicionarBalao("Por favor, selecione abaixo a data em que você realizou essa leitura no hidrômetro:");
        
        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="passo_ViuHoje()">⬅️ Voltar à etapa anterior</button>
            <input type="date" id="step_dataAtual" value="${dadosContaAlta.dataAtual}">
            <div class="button-group">
                <button class="btn-option" onclick="salvar_DataAtualManual()">Avançar</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    function salvar_DataAtualManual() {
        const valor = document.getElementById('step_dataAtual').value;
        if(!valor) { alert("Por favor, selecione uma data válida."); return; }
        dadosContaAlta.dataAtual = valor;
        passo_Moradores();
    }

    // Passo 6: Quantas pessoas residem/usam água
    function passo_Moradores() {
        limparHistoricoEAdicionarBalao("<strong>Passo 6 de 6:</strong><br>Por favor, informe quantas pessoas residem ou utilizam a água deste hidrômetro diariamente (digite apenas números maiores ou iguais a 0):");
        const container = document.createElement('div');
        container.className = 'input-step-container';
        container.innerHTML = `
            <button class="btn-back" onclick="passo_ViuHoje()">⬅️ Voltar à etapa anterior</button>
            <input type="number" id="step_moradores" min="0" placeholder="Exemplo: 3" value="${dadosContaAlta.moradores}">
            <div class="button-group">
                <button class="btn-option" onclick="executarCalculoFinal()">Finalizar e Analisar Dados</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu</button>
            </div>
        `;
        chatBox.appendChild(container);
    }

    // --- REGRAS DE CÁLCULO OMS E DICAS ---
    const textoDicasEconomia = `<br><br>💡 <strong>Dicas para ajudar a diminuir esse consumo:</strong><br>• Acumule roupas para lavar menos vezes por semana com a capacidade máxima;<br>• Reaproveite a água descartada da máquina de lavar para lavar calçadas e quintal;<br>• Desligue o chuveiro enquanto se ensaboa;<br>• Ensaboe toda a louça e depois enxágue tudo de uma vez;<br>• Mantenha a torneira fechada ao escovar os dentes.<br><br>📌 <strong>Dica adicional:</strong> Sempre que for viajar ou se ausentar por mais de 2 dias do imóvel, fechar o registro geral próximo ao hidrômetro.`;

    function executarCalculoFinal() {
        const valorMoradores = parseInt(document.getElementById('step_moradores').value);
        if(isNaN(valorMoradores) || valorMoradores < 0) { alert("Por favor, informe um número de moradores válido (igual ou maior que 0)."); return; }
        dadosContaAlta.moradores = valorMoradores;

        const dAtual = new Date(dadosContaAlta.dataAtual.replace(/-/g, '/'));
        const dAnterior = new Date(dadosContaAlta.dataAnterior.replace(/-/g, '/'));
        const dProxima = new Date(dadosContaAlta.dataProxima.replace(/-/g, '/'));
        const msPorDia = 1000 * 60 * 60 * 24;
        const diasDecorridos = Math.round((dAtual - dAnterior) / msPorDia);
        const diasTotais = Math.round((dProxima - dAnterior) / msPorDia);

        if (diasDecorridos <= 0 || diasTotais <= 0) {
            alert("Erro nas datas digitadas. Verifique se as datas seguem a ordem cronológica correta.");
            return;
        }

        const consumoParcial = dadosContaAlta.leituraAtual - dadosContaAlta.leituraAnterior;
        const consumoDiario = consumoParcial / diasDecorridos;
        const valorEstimadoProximaConta = Math.round(consumoDiario * diasTotais);

        limparHistoricoEAdicionarBalao("Analisando dados do consumo de acordo com a OMS...", false);
        
        agendarTimeout(() => {
            let painelResultado = `Análise de Consumo Concluída! 📊<br><br>• Volume medido até o momento: <strong>${consumoParcial} m³</strong> em ${diasDecorridos} dias.<br>• Consumo médio diário: <strong>${consumoDiario.toFixed(2)} m³</strong>.<br>• Valor estimado para a próxima conta: <strong>${valorEstimadoProximaConta} m³</strong>.<br><br>`;

            const moradoresValidos = dadosContaAlta.moradores || 1;
            const consumoPorPessoa = valorEstimadoProximaConta / moradoresValidos;
            const referenciaOMS = 6; 

            if (dadosContaAlta.moradores === 0) {
                painelResultado += `Como o número de moradores foi definido como 0, segue a análise geral. Se notar um volume muito alto, recomendamos verificar vazamentos estruturais.`;
                limparHistoricoEAdicionarBalao(painelResultado);
                solicitarDecisaoVazamento();
            }
            else if (consumoPorPessoa < referenciaOMS) {
                painelResultado += `🎉 <strong>Parabéns!</strong> O seu consumo estimado por habitante (${consumoPorPessoa.toFixed(1)} m³) é <strong>inferior</strong> ao referencial da OMS de 6m³ ao mês por pessoa. Continue assim!` + textoDicasEconomia;
                limparHistoricoEAdicionarBalao(painelResultado);
                agendarTimeout(() => carregarEtapa('interacaoZ'), 12000);
            } 
            else if (Math.abs(consumoPorPessoa - referenciaOMS) < 0.1) {
                painelResultado += `O consumo medido está <strong>próximo ao referencial da OMS</strong>, onde cada pessoa gasta em média 6m³ ao mês. O consumo é previsto.` + textoDicasEconomia;
                limparHistoricoEAdicionarBalao(painelResultado);
                agendarTimeout(() => carregarEtapa('interacaoZ'), 12000);
            } 
            else if (consumoPorPessoa > referenciaOMS && (consumoPorPessoa - referenciaOMS) <= 3) {
                painelResultado += `Identificamos que o consumo médio por morador (${consumoPorPessoa.toFixed(1)} m³) variou em até 3m³ <strong>acima da referência de consumo da OMS</strong> (que é de 6m³ por pessoa ao mês). Você pode ajudar a diminuir esse consumo com pequenas mudanças:` + textoDicasEconomia;
                limparHistoricoEAdicionarBalao(painelResultado);
                agendarTimeout(() => carregarEtapa('interacaoZ'), 15000);
            } 
            else {
                painelResultado += `⚠️ <strong>Alerta de Consumo Elevado!</strong> O consumo estimado por pessoa está em <strong>${consumoPorPessoa.toFixed(1)} m³</strong>, ultrapassando consideravelmente a média recomendada pela OMS.<br><br>Gostaria de realizar testes práticos para verificar se há vazamentos ocultos?`;
                limparHistoricoEAdicionarBalao(painelResultado);
                solicitarDecisaoVazamento();
            }
        }, 1500);
    }

    function solicitarDecisaoVazamento() {
        agendarTimeout(() => {
            const containerBotoes = document.createElement('div');
            containerBotoes.className = 'options-container';
            containerBotoes.innerHTML = `
                <button class="btn-option" onclick="fluxo_VazamentoDetectado()">Sim, quero testar vazamentos</button>
                <button class="btn-option" onclick="fluxo_ConsumoNormal()">Não, está dentro da minha média</button>
                <button class="btn-option btn-secondary" onclick="carregarEtapa('inicio')">Voltar ao Menu Principal</button>
            `;
            chatBox.appendChild(containerBotoes);
        }, 1000);
    }

    function fluxo_VazamentoDetectado() {
        limparHistoricoEAdicionarBalao("Como a projeção deu alta, há indícios de possíveis <strong>vazamentos ocultos</strong>. Escolha um dos testes recomendados abaixo:");
        const containerBotoes = document.createElement('div');
        containerBotoes.className = 'options-container';
        containerBotoes.innerHTML = `
            <button class="btn-option" onclick="explicar_TesteHidrometro()">Como testar o Hidrômetro</button>
            <button class="btn-option" onclick="explicar_TesteCaixa()">Como testar Caixa d'Água</button>
            <button class="btn-option btn-secondary" onclick="carregarEtapa('interacaoZ')">Encerrar Atendimento</button>
        `;
        chatBox.appendChild(containerBotoes);
    }

    function explicar_TesteHidrometro() {
        let texto = `<strong>Teste do Relógio (Hidrômetro):</strong><br><br>1. Feche todas as torneiras do imóvel e não use banheiros;<br>2. Certifique-se de que não há aparelhos de lavar funcionando;<br>3. Olhe fixamente para a engrenagem menor vermelha do relógio.<br><br>Se ela continuar rodando com tudo fechado, <strong>há um vazamento ativo</strong> na entrada da rua!`;
        limparHistoricoEAdicionarBalao(texto);
        agendarTimeout(() => carregarEtapa('interacaoZ'), 9000);
    }

    function explicar_TesteCaixa() {

    function carregarEtapa(idEtapa) {
        const etapa = fluxo[idEtapa];
        
        if (idEtapa === 'inicio' || idEtapa === 'menu_titularidade') {
            chatBox.innerHTML = "";
        }
        
        adicionarBalao(etapa.texto);

        if (etapa.acaoAutomatica) {
            agendarTimeout(() => {
                carregarEtapa(etapa.acaoAutomatica);
            }, etapa.delay);
            return; 
        }

        const containerBotoes = document.createElement('div');
        containerBotoes.className = 'options-container';

        etapa.opcoes.forEach(opcao => {
            const botao = document.createElement('button');
            botao.className = 'btn-option';
            if (opcao.texto === "Voltar ao Menu") {
                botao.classList.add('btn-secondary');
            }
            
            botao.innerText = opcao.texto;
            botao.onclick = () => {
                containerBotoes.remove();
                if (opcao.acao) {
                    opcao.acao();
                } 
                if (opcao.proximo) {
                    limparHistoricoEAdicionarBalao(opcao.texto, true);
                    agendarTimeout(() => carregarEtapa(opcao.proximo), 500);
                }
            };
            containerBotoes.appendChild(botao);
        });

        chatBox.appendChild(containerBotoes);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.onload = () => carregarEtapa('inicio');
